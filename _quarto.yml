project:
  type: book
  render:
    - index.qmd
    - panel-spat.qmd
    - unit-roots.qmd
    - references.qmd
    - theory/01-cross-sectional-dependence.qmd
    - theory/02-spatial-weights.qmd
    - theory/03-spatial-dependence-tests.qmd
    - theory/04-common-factors-cce.qmd
    - theory/05-spatial-model-choice.qmd
    - theory/06-direct-indirect-effects.qmd
    - theory/07-panel-unit-roots.qmd

book:
  title: "Metrics Masters"
  subtitle: "Reproducing impact-evaluation methods in R"
  author: "Eduard Bukin"
  date: today
  search: true
  chapters:
    - index.qmd
    - part: "Panel data"
      chapters:
        - panel-spat.qmd
        - unit-roots.qmd
    - references.qmd
  appendices:
    - theory/01-cross-sectional-dependence.qmd
    - theory/02-spatial-weights.qmd
    - theory/03-spatial-dependence-tests.qmd
    - theory/04-common-factors-cce.qmd
    - theory/05-spatial-model-choice.qmd
    - theory/06-direct-indirect-effects.qmd
    - theory/07-panel-unit-roots.qmd

bibliography: references.bib

format:
  html:
    theme: sandstone
    # Right-hand per-page contents: deep. Heading numbers: shallow.
    toc: true
    toc-title: "On this page"
    toc-depth: 4
    toc-expand: 3
    number-depth: 2

execute:
  warning: false

# All printed output of a chunk appears in one block, after the code.
knitr:
  opts_chunk:
    results: hold
