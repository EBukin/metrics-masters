project:
  type: book
  render:
    - index.qmd
    - panel-spat.qmd
    - unit-roots.qmd
    - references.qmd
    - theory/01-cross-sectional-dependence.qmd
    - theory/02-spatial-weights.qmd
    - theory/03-spatial-dependence-tests.qmd
    - theory/04-common-factors-cce.qmd
    - theory/05-spatial-model-choice.qmd
    - theory/06-direct-indirect-effects.qmd
    - theory/07-panel-unit-roots.qmd

book:
  title: "Metrics Masters"
  subtitle: "Reproducing impact-evaluation methods in R"
  author: "Eduard Bukin"
  date: today
  search:
    location: sidebar
    type: textbox
  reader-mode: true
  page-navigation: true
  sidebar:
    style: floating
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Panels where units are not independent"
      chapters:
        - panel-spat.qmd
        - unit-roots.qmd
    - references.qmd
  appendices:
    - theory/01-cross-sectional-dependence.qmd
    - theory/02-spatial-weights.qmd
    - theory/03-spatial-dependence-tests.qmd
    - theory/04-common-factors-cce.qmd
    - theory/05-spatial-model-choice.qmd
    - theory/06-direct-indirect-effects.qmd
    - theory/07-panel-unit-roots.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [cosmo, assets/theme.scss, assets/theme-dark.scss]
    respect-user-color-scheme: true
    highlight-style:
      light: github
      dark: github-dark
    # Left sidebar: chapters, with the open page's sections nested below
    # (assets/sidebar-toc.html). Right contents: two levels, only the
    # current group expanded. Heading numbers: shallow.
    include-after-body: assets/sidebar-toc.html
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    toc-expand: 1
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-align: center

execute:
  warning: false

# All printed output of a chunk appears in one block, after the code.
knitr:
  opts_chunk:
    results: hold
