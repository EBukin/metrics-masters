project:
  type: book
  render:
    - index.qmd
    - chapters/00-road-map/index.qmd
    - chapters/01-explore/index.qmd
    - chapters/02-cross-dependence/index.qmd
    - chapters/03-spatial/index.qmd
    - chapters/04-time/index.qmd
    - chapters/05-core/index.qmd
    - references.qmd
    - chapters/02-cross-dependence/theory-cross-sectional-dependence.qmd
    - chapters/02-cross-dependence/theory-common-factors-cce.qmd
    - chapters/03-spatial/theory-spatial-weights.qmd
    - chapters/03-spatial/theory-spatial-dependence-tests.qmd
    - chapters/03-spatial/theory-spatial-model-choice.qmd
    - chapters/03-spatial/theory-spatial-estimation.qmd
    - chapters/03-spatial/theory-direct-indirect-effects.qmd
    - chapters/04-time/theory-panel-unit-roots.qmd

book:
  title: "Metrics Masters"
  subtitle: "Reproducing impact-evaluation methods in R"
  author: "Eduard Bukin"
  date: today
  search:
    location: sidebar
    type: textbox
  reader-mode: true
  page-navigation: true
  sidebar:
    style: floating
    collapse-level: 3
  chapters:
    - index.qmd
    - part: "Set-up"
      chapters:
        - chapters/00-road-map/index.qmd
        - chapters/01-explore/index.qmd
    - part: "Dependence"
      chapters:
        - chapters/02-cross-dependence/index.qmd
        - chapters/03-spatial/index.qmd
        - chapters/04-time/index.qmd
    - part: "Models"
      chapters:
        - chapters/05-core/index.qmd
    - references.qmd
  # Theory notes sit outside the reading order. A book cannot carry a custom
  # sidebar group, and a page listed only in project: render: is not built,
  # so they are appendices, with the heading renamed below.
  appendices:
    - chapters/02-cross-dependence/theory-cross-sectional-dependence.qmd
    - chapters/02-cross-dependence/theory-common-factors-cce.qmd
    - chapters/03-spatial/theory-spatial-weights.qmd
    - chapters/03-spatial/theory-spatial-dependence-tests.qmd
    - chapters/03-spatial/theory-spatial-model-choice.qmd
    - chapters/03-spatial/theory-spatial-estimation.qmd
    - chapters/03-spatial/theory-direct-indirect-effects.qmd
    - chapters/04-time/theory-panel-unit-roots.qmd

language:
  section-title-appendices: "Theory"

bibliography: references.bib

filters:
  - assets/terms.lua

format:
  html:
    # Two-page layout and theme live in assets/ and are tried out first in
    # proto/ (quarto render proto). Links in the text open in a pane on the
    # right; the page contents is a dropdown in the top bar.
    theme:
      light: [cosmo, assets/theme.scss, assets/two-page.scss]
      dark: [cosmo, assets/theme.scss, assets/theme-dark.scss, assets/two-page.scss]
    respect-user-color-scheme: true
    highlight-style:
      light: github
      dark: github-dark
    include-in-header: assets/in-pane.html
    include-after-body:
      - assets/sidebar-toc.html
      - assets/two-page.html
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    toc-expand: 1
    number-depth: 2
    code-copy: true
    code-overflow: scroll
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-align: center

execute:
  freeze: auto
  warning: false

# All printed output of a chunk appears in one block, after the code.
knitr:
  opts_chunk:
    results: hold
