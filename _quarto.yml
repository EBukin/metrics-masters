project:
  type: book
  render:
    - index.qmd
    - panel-spat.qmd
    - unit-roots.qmd
    - references.qmd
    - theory/01-cross-sectional-dependence.qmd
    - theory/02-spatial-weights.qmd
    - theory/03-spatial-dependence-tests.qmd
    - theory/04-common-factors-cce.qmd
    - theory/05-spatial-model-choice.qmd
    - theory/06-direct-indirect-effects.qmd
    - theory/07-panel-unit-roots.qmd

book:
  title: "Metrics Masters"
  subtitle: "Reproducing impact-evaluation methods in R"
  author: "Eduard Bukin"
  date: today
  search:
    location: sidebar
    type: textbox
  reader-mode: true
  page-navigation: true
  sidebar:
    style: floating
    collapse-level: 3
  chapters:
    - index.qmd
    - part: "Panel data"
      chapters:
        - panel-spat.qmd
        - unit-roots.qmd
    - references.qmd
  appendices:
    - theory/01-cross-sectional-dependence.qmd
    - theory/02-spatial-weights.qmd
    - theory/03-spatial-dependence-tests.qmd
    - theory/04-common-factors-cce.qmd
    - theory/05-spatial-model-choice.qmd
    - theory/06-direct-indirect-effects.qmd
    - theory/07-panel-unit-roots.qmd

bibliography: references.bib

format:
  html:
    # Two-page layout and theme live in assets/ and are tried out first in
    # proto/ (quarto render proto). Links in the text open in a pane on the
    # right; the page contents is a dropdown in the top bar.
    theme:
      light: [cosmo, assets/theme.scss, assets/two-page.scss]
      dark: [cosmo, assets/theme.scss, assets/theme-dark.scss, assets/two-page.scss]
    respect-user-color-scheme: true
    highlight-style:
      light: github
      dark: github-dark
    include-in-header: assets/in-pane.html
    include-after-body:
      - assets/sidebar-toc.html
      - assets/two-page.html
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    toc-expand: 1
    number-depth: 2
    code-copy: true
    code-overflow: scroll
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-align: center

execute:
  freeze: auto
  warning: false

# All printed output of a chunk appears in one block, after the code.
knitr:
  opts_chunk:
    results: hold
