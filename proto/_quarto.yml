# Style prototype: a small R-free copy of the book's layout.
# Shares the main book theme in ../assets; try layout changes here first.
# Render: quarto render proto   (seconds; no R, no renv)
project:
  type: book
  output-dir: _book

book:
  title: "Metrics Masters (prototype)"
  subtitle: "Layout and style sandbox"
  author: "Eduard Bukin"
  search:
    location: sidebar
    type: textbox
  reader-mode: true
  page-navigation: true
  sidebar:
    style: floating
    collapse-level: 3
  chapters:
    - index.qmd
    - part: "Panels where units are not independent"
      chapters:
        - dependence.qmd
        - unit-roots.qmd
    - glossary.qmd
    - references.qmd
  appendices:
    - theory/cd-test.qmd

bibliography: ../references.bib
engine: markdown
filters:
  - ../assets/terms.lua

format:
  html:
    theme:
      light: [cosmo, ../assets/theme.scss, ../assets/two-page.scss]
      dark: [cosmo, ../assets/theme.scss, ../assets/theme-dark.scss, ../assets/two-page.scss]
    respect-user-color-scheme: true
    highlight-style:
      light: github
      dark: github-dark
    include-in-header: ../assets/in-pane.html
    include-after-body:
      - ../assets/sidebar-toc.html
      - ../assets/two-page.html
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    toc-expand: 1
    number-depth: 2
    code-copy: true
    code-overflow: scroll
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-align: center
