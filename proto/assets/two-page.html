<script>
// Two-page layout: the book page stays on the left; a cross-reference or
// any link to another page of the book opens that page in a pane on the
// right. The sidebar is fixed, resizable, and collapses to a rail only on
// request. Each column has a top bar of the same height (--tp-bar).
// Styles: assets/two-page.scss. Phones keep the normal layout.
(function () {
  if (document.documentElement.classList.contains("tp-in-pane")) {
    // Inside the pane: flash the heading the link pointed at.
    window.addEventListener("load", function () {
      var id = decodeURIComponent(location.hash.slice(1));
      var el = id && document.getElementById(id);
      if (el) el.classList.add("tp-flash");
    });
    return;
  }

  var root = document.documentElement;
  var desktop = window.matchMedia("(min-width: 768px)");
  var RAIL = 44, SB_MIN = 200, SB_MAX = 440, MAIN_MIN = 420, PANE_MIN = 320;
  var GAP = 40;

  // Per-viewer layout memory; the page works without it.
  function load() {
    try { return JSON.parse(localStorage.getItem("tp-layout")) || {}; }
    catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem("tp-layout", JSON.stringify(state)); }
    catch (e) {}
  }
  var state = Object.assign({ sb: 272, collapsed: false, split: 0.5 }, load());

  var sidebar = document.getElementById("quarto-sidebar");
  var main = document.querySelector("main.content");
  if (!sidebar || !main) return;

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html) e.innerHTML = html;
    return e;
  }
  function iconButton(act, icon, label) {
    var b = el("button", "tp-icon", '<i class="bi ' + icon + '"></i>');
    b.type = "button";
    b.setAttribute("data-act", act);
    b.setAttribute("aria-label", label);
    b.title = label;
    return b;
  }

  // Desktop moves a few of Quarto's elements into the bars; phones get them
  // back where Quarto put them.
  var moves = [];
  function movable(node, target) {
    if (node) {
      moves.push({ node: node, home: node.parentNode,
                   next: node.nextSibling, target: target });
    }
  }
  var placed = null;
  function place() {
    if (placed === desktop.matches) return;
    placed = desktop.matches;
    moves.forEach(function (m) {
      if (desktop.matches) m.target.appendChild(m.node);
      else m.home.insertBefore(m.node, m.next);
    });
  }

  // Sidebar bar: book title and the collapse toggle on one row. The dark
  // mode and reader toggles sit beside the search box.
  var sbBar = el("div", "tp-bar tp-sb-bar");
  var sbTitle = el("div", "tp-bar-title");
  var toggle = iconButton("sidebar", "bi-chevron-left", "Narrow the sidebar");
  toggle.classList.add("tp-sb-toggle");
  sbBar.appendChild(sbTitle);
  sbBar.appendChild(toggle);
  sidebar.insertBefore(sbBar, sidebar.firstChild);
  var titleLink = sidebar.querySelector(".sidebar-title > a");
  if (titleLink) titleLink.title = titleLink.textContent.trim();
  movable(titleLink, sbTitle);
  var tools = sidebar.querySelector(".sidebar-tools-main");
  var search = sidebar.querySelector(".sidebar-search");
  if (tools && search) movable(tools, search);
  toggle.addEventListener("click", function () {
    state.collapsed = !state.collapsed;
    save();
    layout();
  });

  // Book bar: breadcrumb on the left, "On this page" on the right.
  var bookBar = el("div", "tp-bar tp-book-bar");
  var crumbs = el("div", "tp-crumbs");
  var tocSlot = el("div", "tp-toc-slot");
  bookBar.appendChild(crumbs);
  bookBar.appendChild(tocSlot);
  document.body.appendChild(bookBar);
  movable(main.querySelector(".quarto-title-breadcrumbs"), crumbs);
  var toc = document.getElementById("quarto-margin-sidebar");
  movable(toc, tocSlot);

  // The contents is a dropdown: hover or click opens it, a click on an
  // entry, outside, or Esc closes it.
  var tocTitle = document.getElementById("toc-title");
  if (toc && tocTitle) {
    tocTitle.setAttribute("tabindex", "0");
    tocTitle.setAttribute("role", "button");
    tocTitle.addEventListener("click", function () {
      toc.classList.toggle("is-open");
    });
    tocTitle.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toc.classList.toggle("is-open");
      }
    });
    toc.addEventListener("click", function (e) {
      if (e.target.closest("a")) {
        toc.classList.remove("is-open");
        toc.classList.add("is-shut");
      }
    });
    toc.addEventListener("mouseleave", function () {
      toc.classList.remove("is-shut");
    });
    document.addEventListener("click", function (e) {
      if (!toc.contains(e.target)) toc.classList.remove("is-open");
    });
  }

  // Handles.
  function handle(cls) {
    var h = el("div", "tp-handle " + cls);
    document.body.appendChild(h);
    return h;
  }
  var hSb = handle("tp-handle-sb");
  var hSplit = handle("tp-handle-split");

  // Pane.
  var pane = el("div", "tp-pane");
  pane.setAttribute("role", "complementary");
  pane.setAttribute("aria-label", "Second page");
  var paneBar = el("div", "tp-bar tp-pane-bar");
  var title = el("div", "tp-bar-title tp-pane-title", "Second page");
  paneBar.appendChild(title);
  paneBar.appendChild(
    iconButton("main", "bi-box-arrow-up-left", "Open as the main page"));
  paneBar.appendChild(iconButton("close", "bi-x-lg", "Close (Esc)"));
  pane.appendChild(paneBar);
  pane.appendChild(el("div", "tp-pane-empty",
    "Click a cross-reference or a link to another page.<br>" +
    "It opens here, and this page stays put."));
  var frame = el("iframe");
  frame.title = "Second page";
  frame.name = "tp-pane";
  pane.appendChild(frame);
  document.body.appendChild(pane);

  function layout() {
    place();
    if (!desktop.matches) return;
    var vw = root.clientWidth;
    var sb = state.collapsed ? RAIL : state.sb;
    var room = vw - sb - 2 * GAP;
    var mainW = Math.max(MAIN_MIN, Math.min(room - PANE_MIN, room * state.split));
    mainW = Math.min(mainW, 820);
    root.classList.toggle("tp-sb-collapsed", state.collapsed);
    root.style.setProperty("--tp-sb", sb + "px");
    root.style.setProperty("--tp-main", mainW + "px");
    root.style.setProperty("--tp-gap", GAP + "px");
    var paneLeft = sb + GAP + mainW + GAP;
    pane.style.left = paneLeft + "px";
    hSb.style.left = sb + "px";
    hSplit.style.left = paneLeft + "px";
    toggle.innerHTML = '<i class="bi ' +
      (state.collapsed ? "bi-chevron-right" : "bi-chevron-left") + '"></i>';
    toggle.title = state.collapsed ? "Show the sidebar" : "Narrow the sidebar";
    toggle.setAttribute("aria-label", toggle.title);
  }

  function drag(h, onMove) {
    h.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      h.setPointerCapture(e.pointerId);
      h.classList.add("is-active");
      document.body.classList.add("tp-dragging");
      function move(ev) { onMove(ev.clientX); layout(); }
      function up() {
        h.removeEventListener("pointermove", move);
        h.removeEventListener("pointerup", up);
        h.classList.remove("is-active");
        document.body.classList.remove("tp-dragging");
        save();
      }
      h.addEventListener("pointermove", move);
      h.addEventListener("pointerup", up);
    });
  }
  drag(hSb, function (x) {
    state.sb = Math.max(SB_MIN, Math.min(SB_MAX, x));
  });
  drag(hSplit, function (x) {
    var sb = state.collapsed ? RAIL : state.sb;
    var room = root.clientWidth - sb - 2 * GAP;
    state.split = Math.max(0.25, Math.min(0.8, (x - sb - 2 * GAP) / room));
  });

  // Open and close.
  function setQuery(href) {
    var u = new URL(location.href);
    if (href) u.searchParams.set("pane", href);
    else u.searchParams.delete("pane");
    history.replaceState(null, "", u);
  }
  function open(url, label) {
    var src = new URL(url, location.href);
    src.searchParams.set("tp-pane", "1");
    frame.src = src.href;
    title.textContent = label || url.replace(/^.*\//, "");
    pane.classList.add("is-open");
    setQuery(url);
  }
  function close() {
    frame.removeAttribute("src");
    pane.classList.remove("is-open");
    setQuery(null);
  }
  pane.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    var act = b && b.getAttribute("data-act");
    if (act === "close") close();
    if (act === "main" && frame.src) {
      var u = new URL(frame.src);
      u.searchParams.delete("tp-pane");
      location.href = u.href;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (toc && toc.classList.contains("is-open")) {
      toc.classList.remove("is-open");
    } else if (pane.classList.contains("is-open")) {
      close();
    }
  });

  // Which links open in the pane: links in the page body to another page
  // of this book. Same-page anchors, the sidebar, the contents, the page
  // navigation and external sites behave as usual.
  function paneTarget(a) {
    if (!a || !main.contains(a)) return null;
    if (a.closest(".page-navigation, .quarto-title-breadcrumbs, #TOC")) {
      return null;
    }
    if (a.target === "_blank" || a.hasAttribute("download")) return null;
    var href = a.getAttribute("href");
    if (!href || href.charAt(0) === "#") return null;
    var url = new URL(href, location.href);
    if (url.protocol !== location.protocol || url.host !== location.host) {
      return null;
    }
    if (!/\.html$/.test(url.pathname)) return null;
    if (url.pathname === location.pathname) return null;
    return url;
  }
  main.querySelectorAll("a[href]").forEach(function (a) {
    if (paneTarget(a)) a.classList.add("tp-pane-link");
  });
  main.addEventListener("click", function (e) {
    if (!desktop.matches) return;
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) {
      return;
    }
    var a = e.target.closest("a[href]");
    var url = paneTarget(a);
    if (!url) return;
    e.preventDefault();
    open(url.href, a.textContent.trim());
  });

  // Reopen the pane named in the address (shared link, reload).
  var start = new URL(location.href).searchParams.get("pane");
  if (start) open(start);

  window.addEventListener("resize", layout);
  desktop.addEventListener("change", layout);
  layout();
})();
</script>
