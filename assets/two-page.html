<script>
// Two-page layout: the book page stays on the left; a cross-reference or
// any link to another page of the book opens that page in a pane on the
// right. The sidebar is fixed, resizable, and collapses to a rail only on
// request. Each column has a top bar of the same height (--tp-bar).
// Styles: assets/two-page.scss. Phones keep the normal layout.
(function () {
  // Wide tables scroll sideways in their own box instead of squeezing their
  // columns or running out of the column; in the pane as on the page.
  document.querySelectorAll("main.content table").forEach(function (t) {
    if (t.parentElement.classList.contains("tp-table-scroll")) return;
    var box = document.createElement("div");
    box.className = "tp-table-scroll";
    t.parentNode.insertBefore(box, t);
    box.appendChild(t);
    var row = t.querySelector("tr");
    if (row && row.children.length > 5) t.classList.add("tp-table-wide");
  });

  if (document.documentElement.classList.contains("tp-in-pane")) {
    inPane();
    return;
  }

  // Inside the pane. The parent cannot read this frame on file://, so the
  // page reports itself by postMessage: its address, page and section
  // titles, and its contents. The parent may ask it to go to an anchor.
  function inPane() {
    function clean(t) { return (t || "").replace(/\s+/g, " ").trim(); }
    var HEADS = ":scope > h1, :scope > h2, :scope > h3, :scope > h4, " +
      ":scope > h5, :scope > h6";
    // The heading of the section that holds el. An unnumbered subsection
    // ("Read it") gets its parent's heading in front, so it can be told
    // apart from its namesakes.
    function headingOf(el) {
      if (!el) return "";
      var sec = el.closest("section[id]");
      var h = /^H[1-6]$/.test(el.tagName) ? el :
        sec && sec.querySelector(HEADS);
      if (!h) return "";
      var text = clean(h.textContent);
      if (!h.querySelector(".header-section-number") && sec) {
        var up = sec.parentElement && sec.parentElement.closest("section[id]");
        var uh = up && up.querySelector(HEADS);
        if (uh && uh.tagName !== "H1") {
          text = clean(uh.textContent) + " › " + text;
        }
      }
      return text;
    }
    var h1 = document.querySelector("main.content h1");
    var pageTitle = h1 ? clean(h1.textContent) : clean(document.title);

    // Snippet mode (?tp-only=<id>, set up by assets/in-pane.html): show only
    // that element, a footnote or an index entry, instead of the whole page.
    var snippet = null;
    var only = document.documentElement.getAttribute("data-tp-only");
    var part = only ? document.getElementById(only) : null;
    if (part) {
      snippet = buildSnippet(part);
    } else {
      document.documentElement.classList.remove("tp-only");
    }
    function buildSnippet(part) {
      var box = document.createElement("div");
      box.className = "tp-snippet";
      var note = /^fn\d+$/.test(part.id) && part.closest("#footnotes");
      var label = "";
      var head = document.createElement("p");
      head.className = "tp-snippet-head";
      if (note) {
        label = "Note " + part.id.slice(2);
        head.textContent = label + ", from " + pageTitle;
      } else {
        var strong = part.querySelector("strong");
        label = clean(strong ? strong.textContent : part.textContent);
        head.textContent = "From the " + pageTitle.toLowerCase();
      }
      box.appendChild(head);
      // A copy without ids, so the page keeps one element per id.
      var body = document.createElement("div");
      body.className = "tp-snippet-body";
      Array.prototype.forEach.call(part.childNodes, function (c) {
        body.appendChild(c.cloneNode(true));
      });
      body.querySelectorAll("[id]").forEach(function (e) {
        e.removeAttribute("id");
      });
      body.querySelectorAll(".footnote-back").forEach(function (e) {
        e.remove();
      });
      box.appendChild(body);
      if (note) {
        // The full page, at the place the note is called from.
        var u = new URL(location.href);
        u.searchParams.delete("tp-pane");
        u.searchParams.delete("tp-only");
        u.hash = "fnref" + part.id.slice(2);
        var more = document.createElement("a");
        more.className = "tp-snippet-more";
        more.href = u.href;
        more.textContent = "Show in the chapter";
        box.appendChild(more);
      }
      var main = document.querySelector("main.content");
      main.insertBefore(box, main.firstChild);
      return { label: label };
    }

    function report() {
      var id = decodeURIComponent(location.hash.slice(1));
      var target = id ? document.getElementById(id) : null;
      // The contents, with each entry's depth; none for a snippet.
      var toc = [];
      var links = snippet ? [] :
        document.querySelectorAll("nav#TOC a.nav-link");
      Array.prototype.forEach.call(links, function (a) {
        var level = 0;
        for (var n = a.parentElement; n && n.id !== "TOC"; n = n.parentElement) {
          if (n.tagName === "UL") level++;
        }
        toc.push({ id: a.getAttribute("href").slice(1),
                   text: clean(a.textContent), level: level });
      });
      var u = new URL(location.href);
      u.searchParams.delete("tp-pane");
      window.parent.postMessage({
        tp: "loaded",
        url: u.href,
        title: pageTitle,
        section: snippet ? snippet.label :
          target && target !== h1 ? headingOf(target) : "",
        toc: toc
      }, "*");
      // Flash the element the link pointed at.
      if (target) {
        target.classList.remove("tp-flash");
        void target.offsetWidth;
        target.classList.add("tp-flash");
      }
    }
    window.addEventListener("message", function (e) {
      if (e.source !== window.parent || !e.data || e.data.tp !== "goto") {
        return;
      }
      if (document.getElementById(e.data.id)) location.hash = e.data.id;
    });
    window.addEventListener("hashchange", report);
    window.addEventListener("load", report);
  }

  var root = document.documentElement;
  var desktop = window.matchMedia("(min-width: 768px)");
  var RAIL = 44, SB_MIN = 200, SB_MAX = 440, MAIN_MIN = 420, PANE_MIN = 320;
  var GAP = 40;

  // Per-viewer layout memory; the page works without it.
  function load() {
    try { return JSON.parse(localStorage.getItem("tp-layout")) || {}; }
    catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem("tp-layout", JSON.stringify(state)); }
    catch (e) {}
  }
  var state = Object.assign({ sb: 272, collapsed: false, split: 0.5 }, load());

  var sidebar = document.getElementById("quarto-sidebar");
  var main = document.querySelector("main.content");
  if (!sidebar || !main) return;

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html) e.innerHTML = html;
    return e;
  }
  function iconButton(act, icon, label) {
    var b = el("button", "tp-icon", '<i class="bi ' + icon + '"></i>');
    b.type = "button";
    b.setAttribute("data-act", act);
    b.setAttribute("aria-label", label);
    b.title = label;
    return b;
  }

  // Desktop moves a few of Quarto's elements into the bars; phones get them
  // back where Quarto put them.
  var moves = [];
  function movable(node, target) {
    if (node) {
      moves.push({ node: node, home: node.parentNode,
                   next: node.nextSibling, target: target });
    }
  }
  var placed = null;
  function place() {
    if (placed === desktop.matches) return;
    placed = desktop.matches;
    moves.forEach(function (m) {
      if (desktop.matches) m.target.appendChild(m.node);
      else m.home.insertBefore(m.node, m.next);
    });
  }

  // Sidebar bar: book title and the collapse toggle on one row. The dark
  // mode and reader toggles sit beside the search box.
  var sbBar = el("div", "tp-bar tp-sb-bar");
  var sbTitle = el("div", "tp-bar-title");
  var toggle = iconButton("sidebar", "bi-chevron-left", "Narrow the sidebar");
  toggle.classList.add("tp-sb-toggle");
  sbBar.appendChild(sbTitle);
  sbBar.appendChild(toggle);
  sidebar.insertBefore(sbBar, sidebar.firstChild);
  var titleLink = sidebar.querySelector(".sidebar-title > a");
  if (titleLink) titleLink.title = titleLink.textContent.trim();
  movable(titleLink, sbTitle);
  var tools = sidebar.querySelector(".sidebar-tools-main");
  var search = sidebar.querySelector(".sidebar-search");
  if (tools && search) movable(tools, search);
  toggle.addEventListener("click", function () {
    state.collapsed = !state.collapsed;
    save();
    layout();
  });

  // Book bar: breadcrumb on the left, "On this page" on the right.
  var bookBar = el("div", "tp-bar tp-book-bar");
  var crumbs = el("div", "tp-crumbs");
  var tocSlot = el("div", "tp-toc-slot");
  bookBar.appendChild(crumbs);
  bookBar.appendChild(tocSlot);
  document.body.appendChild(bookBar);
  movable(main.querySelector(".quarto-title-breadcrumbs"), crumbs);
  var toc = document.getElementById("quarto-margin-sidebar");
  movable(toc, tocSlot);

  // The contents is a dropdown: hover or click opens it, a click on an
  // entry, outside, or Esc closes it.
  var tocTitle = document.getElementById("toc-title");
  if (toc && tocTitle) {
    tocTitle.setAttribute("tabindex", "0");
    tocTitle.setAttribute("role", "button");
    tocTitle.addEventListener("click", function () {
      toc.classList.toggle("is-open");
    });
    tocTitle.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toc.classList.toggle("is-open");
      }
    });
    toc.addEventListener("click", function (e) {
      if (e.target.closest("a")) {
        toc.classList.remove("is-open");
        toc.classList.add("is-shut");
      }
    });
    toc.addEventListener("mouseleave", function () {
      toc.classList.remove("is-shut");
    });
    document.addEventListener("click", function (e) {
      if (!toc.contains(e.target)) toc.classList.remove("is-open");
    });
  }

  // Handles.
  function handle(cls) {
    var h = el("div", "tp-handle " + cls);
    document.body.appendChild(h);
    return h;
  }
  var hSb = handle("tp-handle-sb");
  var hSplit = handle("tp-handle-split");

  // Pane.
  var pane = el("div", "tp-pane");
  pane.setAttribute("role", "complementary");
  pane.setAttribute("aria-label", "Second page");
  var paneBar = el("div", "tp-bar tp-pane-bar");
  var title = el("div", "tp-bar-title tp-pane-title", "Second page");
  title.setAttribute("aria-live", "polite");
  var back = iconButton("back", "bi-arrow-left", "Back");
  var fwd = iconButton("forward", "bi-arrow-right", "Forward");
  paneBar.appendChild(back);
  paneBar.appendChild(fwd);
  paneBar.appendChild(title);
  // The pane page's own contents, from its report.
  var paneToc = el("div", "tp-menu tp-pane-toc");
  var paneTocBtn = iconButton("toc", "bi-list-ul", "On this page");
  paneTocBtn.setAttribute("aria-haspopup", "true");
  paneTocBtn.setAttribute("aria-expanded", "false");
  var paneTocList = el("ul", "tp-menu-list");
  paneToc.appendChild(paneTocBtn);
  paneToc.appendChild(paneTocList);
  paneBar.appendChild(paneToc);
  paneBar.appendChild(
    iconButton("main", "bi-box-arrow-up-left", "Open as the main page"));
  paneBar.appendChild(iconButton("close", "bi-x-lg", "Close (Esc)"));
  pane.appendChild(paneBar);
  pane.appendChild(el("div", "tp-pane-empty",
    "Click a cross-reference or a link to another page.<br>" +
    "It opens here, and this page stays put."));
  var frame = el("iframe");
  frame.title = "Second page";
  frame.name = "tp-pane";
  pane.appendChild(frame);
  document.body.appendChild(pane);

  function layout() {
    place();
    if (!desktop.matches) return;
    var vw = root.clientWidth;
    var sb = state.collapsed ? RAIL : state.sb;
    var room = vw - sb - 2 * GAP;
    var mainW = Math.max(MAIN_MIN, Math.min(room - PANE_MIN, room * state.split));
    mainW = Math.min(mainW, 820);
    root.classList.toggle("tp-sb-collapsed", state.collapsed);
    root.style.setProperty("--tp-sb", sb + "px");
    root.style.setProperty("--tp-main", mainW + "px");
    root.style.setProperty("--tp-gap", GAP + "px");
    var paneLeft = sb + GAP + mainW + GAP;
    pane.style.left = paneLeft + "px";
    hSb.style.left = sb + "px";
    hSplit.style.left = paneLeft + "px";
    toggle.innerHTML = '<i class="bi ' +
      (state.collapsed ? "bi-chevron-right" : "bi-chevron-left") + '"></i>';
    toggle.title = state.collapsed ? "Show the sidebar" : "Narrow the sidebar";
    toggle.setAttribute("aria-label", toggle.title);
  }

  function drag(h, onMove) {
    h.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      h.setPointerCapture(e.pointerId);
      h.classList.add("is-active");
      document.body.classList.add("tp-dragging");
      function move(ev) { onMove(ev.clientX); layout(); }
      function up() {
        h.removeEventListener("pointermove", move);
        h.removeEventListener("pointerup", up);
        h.classList.remove("is-active");
        document.body.classList.remove("tp-dragging");
        save();
      }
      h.addEventListener("pointermove", move);
      h.addEventListener("pointerup", up);
    });
  }
  drag(hSb, function (x) {
    state.sb = Math.max(SB_MIN, Math.min(SB_MAX, x));
  });
  drag(hSplit, function (x) {
    var sb = state.collapsed ? RAIL : state.sb;
    var room = root.clientWidth - sb - 2 * GAP;
    state.split = Math.max(0.25, Math.min(0.8, (x - sb - 2 * GAP) / room));
  });

  // Open and close.
  function setQuery(href) {
    var u = new URL(location.href);
    if (href) u.searchParams.set("pane", href);
    else u.searchParams.delete("pane");
    history.replaceState(null, "", u);
  }
  function setTitle(page, section) {
    title.textContent = "";
    title.appendChild(el("span", "tp-pane-page")).textContent = page;
    if (section) {
      title.appendChild(el("span", "tp-pane-sec")).textContent = section;
    }
    title.title = section ? page + " › " + section : page;
  }
  // The address of the pane page, relative to this page, for ?pane=.
  function relative(href) {
    var to = new URL(href), from = new URL(location.href);
    if (to.origin !== from.origin) return href;
    var a = from.pathname.split("/").slice(0, -1);
    var b = to.pathname.split("/");
    var i = 0;
    while (i < a.length && i < b.length - 1 && a[i] === b[i]) i++;
    var up = a.slice(i).map(function () { return ".."; });
    return up.concat(b.slice(i)).join("/") + to.search + to.hash;
  }
  var current = null;   // address of the page shown in the pane

  // Pane history, for this page load only: the addresses the pane has
  // shown, and where in that list it is. A page the pane reports that is
  // not the current entry is pushed, dropping the entries ahead of it;
  // Back and Forward move the index and say so, so the report that
  // follows does not push.
  var past = [], at = -1, moving = false;
  function syncButtons() {
    back.disabled = at <= 0;
    fwd.disabled = at >= past.length - 1;
  }
  function paneSrc(url) {
    var src = new URL(url, location.href);
    src.searchParams.set("tp-pane", "1");
    return src;
  }
  function go(step) {
    var i = at + step;
    if (i < 0 || i >= past.length) return;
    at = i;
    moving = true;
    var src = paneSrc(past[at]).href;
    // replace() keeps these moves out of the browser's own history.
    try { frame.contentWindow.location.replace(src); }
    catch (e) { frame.src = src; }
    syncButtons();
  }
  function record(url) {
    if (moving) {
      moving = false;
      past[at] = url;
    } else if (past[at] !== url) {
      past = past.slice(0, at + 1);
      past.push(url);
      at = past.length - 1;
    }
    syncButtons();
  }

  function open(url) {
    var src = paneSrc(url);
    frame.src = src.href;
    // Until the page reports its own title, show its file name.
    setTitle(decodeURIComponent(src.pathname.replace(/^.*\//, "")),
             decodeURIComponent(src.hash.slice(1)));
    pane.classList.add("is-open");
    current = new URL(url, location.href).href;
  }
  window.addEventListener("message", function (e) {
    if (e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d || d.tp !== "loaded" || typeof d.url !== "string") return;
    if (!pane.classList.contains("is-open")) return;
    current = d.url;
    record(d.url);
    fillToc(Array.isArray(d.toc) ? d.toc : [],
            decodeURIComponent(new URL(d.url).hash.slice(1)));
    setTitle(String(d.title || ""), String(d.section || ""));
    setQuery(relative(d.url));
  });
  function fillToc(items, here) {
    paneTocList.textContent = "";
    items.forEach(function (t) {
      var li = el("li");
      var b = el("button", "tp-menu-item");
      b.type = "button";
      b.textContent = String(t.text || "");
      b.setAttribute("data-id", String(t.id || ""));
      b.style.paddingLeft = (0.6 + 0.85 * Math.max(0, (t.level || 1) - 1)) +
        "rem";
      if (t.id === here) b.classList.add("is-current");
      li.appendChild(b);
      paneTocList.appendChild(li);
    });
    paneToc.hidden = items.length === 0;
    showToc(false);
  }
  function showToc(on) {
    paneToc.classList.toggle("is-open", on);
    paneTocBtn.setAttribute("aria-expanded", on ? "true" : "false");
  }
  paneTocList.addEventListener("click", function (e) {
    var b = e.target.closest("[data-id]");
    if (!b) return;
    showToc(false);
    frame.contentWindow.postMessage(
      { tp: "goto", id: b.getAttribute("data-id") }, "*");
  });
  document.addEventListener("click", function (e) {
    if (!paneToc.contains(e.target)) showToc(false);
  });
  // A click inside the pane page takes focus away from this window.
  window.addEventListener("blur", function () {
    showToc(false);
    if (toc) toc.classList.remove("is-open");
  });

  function close() {
    frame.removeAttribute("src");
    current = null;
    past = [];
    at = -1;
    moving = false;
    syncButtons();
    fillToc([], "");
    pane.classList.remove("is-open");
    setQuery(null);
  }
  pane.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    var act = b && b.getAttribute("data-act");
    if (act === "close") close();
    if (act === "toc") showToc(!paneToc.classList.contains("is-open"));
    if (act === "back") go(-1);
    if (act === "forward") go(1);
    if (act === "main" && current) {
      // The main window shows the whole page, at the snippet's element.
      var u = new URL(current);
      var part = u.searchParams.get("tp-only");
      if (part) {
        u.searchParams.delete("tp-only");
        u.hash = part;
      }
      location.href = u.href;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (toc && toc.classList.contains("is-open")) {
      toc.classList.remove("is-open");
    } else if (paneToc.classList.contains("is-open")) {
      showToc(false);
    } else if (pane.classList.contains("is-open")) {
      close();
    }
  });

  // Which links open in the pane: every link in the page body to a page
  // of this book, including anchors on this same page (the reader keeps
  // their place on the left). The sidebar, the contents, breadcrumbs, page
  // navigation, heading anchors, footnote back-links, tabs and external
  // sites behave as usual.
  function paneTarget(a) {
    if (!a || !main.contains(a)) return null;
    if (a.closest(".page-navigation, .quarto-title-breadcrumbs, #TOC")) {
      return null;
    }
    if (a.matches(".anchorjs-link, .footnote-back, [data-bs-toggle], " +
                  "[role=tab]")) {
      return null;
    }
    if (a.target === "_blank" || a.hasAttribute("download")) return null;
    var href = a.getAttribute("href");
    if (!href || href === "#") return null;
    var url = new URL(href, location.href);
    if (url.protocol !== location.protocol || url.host !== location.host) {
      return null;
    }
    if (!/\.html$/.test(url.pathname)) return null;
    if (url.pathname === location.pathname) {
      // This page: an anchor only, never this page's own ?pane= state.
      if (!url.hash) return null;
      url.search = "";
    }
    // A footnote shows only the note; an index term only its entry.
    if (a.matches(".footnote-ref, .tp-term") && url.hash) asSnippet(url);
    return url;
  }
  function asSnippet(url) {
    url.searchParams.set("tp-only", decodeURIComponent(url.hash.slice(1)));
    url.hash = "";
  }
  main.querySelectorAll("a[href]").forEach(function (a) {
    if (paneTarget(a)) a.classList.add("tp-pane-link");
  });
  main.addEventListener("click", function (e) {
    if (!desktop.matches) return;
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) {
      return;
    }
    var a = e.target.closest("a[href]");
    var url = paneTarget(a);
    if (!url) return;
    e.preventDefault();
    // Quarto's smooth scroll listens on window and ignores preventDefault;
    // without this it would also scroll the left page to the anchor.
    e.stopPropagation();
    open(url.href);
  });

  // Reopen the pane named in the address (shared link, reload).
  var start = new URL(location.href).searchParams.get("pane");
  if (start) open(start);

  syncButtons();
  fillToc([], "");
  window.addEventListener("resize", layout);
  desktop.addEventListener("change", layout);
  layout();
})();
</script>
